<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Legal Metrology</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-brand">

            <div class="auth-logo">⚖️</div>

            <h1>Legal Metrology</h1>

            <p>
                Digital Verification & Certification Portal
            </p>

            <div class="auth-info">
                <p>✓ Secure access</p>
                <p>✓ Digital verification</p>
                <p>✓ Certificate management</p>
            </div>

        </div>


        <div class="auth-form">

            <h2>Welcome Back</h2>

            <p class="form-subtitle">
                Login to your account
            </p>


            <form id="loginForm">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <div class="form-options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <a href="register.html" class="primary-btn">
                    Login
                </a>

            </form>


            <p class="switch-form">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>


            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>


    <script src="js/app.js"></script>

</body>
</html>
